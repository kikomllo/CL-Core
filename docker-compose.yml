services:
  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    network_mode: host
    restart: unless-stopped

  jarvis-whisper:
    build: .
    container_name: jarvis-whisper
    command: python src/clWhisper.py
    network_mode: host
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - JARVIS_ECOSYSTEM=1

  jarvis-brain:
    build: .
    container_name: jarvis-brain
    command: python src/clDaemon.py
    network_mode: host
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - JARVIS_ECOSYSTEM=1

  jarvis-music:
    build: .
    container_name: jarvis-music
    command: python src/clSpotify.py
    network_mode: host
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - JARVIS_ECOSYSTEM=1

  jarvis-tts:
    build: .
    container_name: jarvis-tts
    command: python src/clTTS.py
    network_mode: host
    user: "1000:1000"
    group_add:
      - audio
    volumes:
      - .:/app
      - /run/user/1000/pulse:/run/user/1000/pulse
      - ${HOME}/.config/pulse:/home/kikomlo/.config/pulse
      - ./asound.conf:/etc/asound.conf
    devices:
      - /dev/snd:/dev/snd
    environment:
      - PYTHONUNBUFFERED=1
      - JARVIS_ECOSYSTEM=1
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
      - HOME=/home/kikomlo
      - XDG_RUNTIME_DIR=/run/user/1000

  jarvis-light:
    build: .
    container_name: jarvis-light
    command: python src/clControl.py
    network_mode: host
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - JARVIS_ECOSYSTEM=1

  jarvis-mic:
    build: .
    container_name: jarvis-mic
    command: python src/clMic.py
    network_mode: host
    user: "1000:1000"
    group_add:
      - audio
    volumes:
      - .:/app
      - /run/user/1000/pulse:/run/user/1000/pulse
      - ${HOME}/.config/pulse:/home/kikomlo/.config/pulse
      - ./asound.conf:/etc/asound.conf
    devices:
      - /dev/snd:/dev/snd
    environment:
      - PYTHONUNBUFFERED=1
      - JARVIS_ECOSYSTEM=1
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
      - HOME=/home/kikomlo
      - XDG_RUNTIME_DIR=/run/user/1000

  jarvis-terminal:
    build: .
    container_name: jarvis-terminal
    command: python src/clTerminal.py
    network_mode: host
    volumes:
      - .:/app
      - /run/user/1000/bus:/run/user/1000/bus
    user: "1000:1000"
    environment:
      - PYTHONUNBUFFERED=1
      - JARVIS_ECOSYSTEM=1
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus

